<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chat Nhanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="w-full max-w-sm bg-white rounded-lg shadow-md p-4">
        <div id="chatBox" class="h-80 overflow-y-auto mb-4 p-2 border rounded bg-gray-50"></div>
        <div class="flex gap-2">
            <input id="msg" type="text" placeholder="Nhập tin nhắn..." class="flex-1 border p-2 rounded">
            <button onclick="send()" class="bg-blue-500 text-white px-4 py-2 rounded">Gửi</button>
        </div>
    </div>

    <script>
        function render() {
            const msgs = JSON.parse(localStorage.getItem('chats') || '[]');
            document.getElementById('chatBox').innerHTML = msgs.map(m => `<div class="mb-2 p-2 bg-white border rounded">${m}</div>`).join('');
        }
        function send() {
            const input = document.getElementById('msg');
            if(!input.value) return;
            const msgs = JSON.parse(localStorage.getItem('chats') || '[]');
            msgs.push(input.value);
            localStorage.setItem('chats', JSON.stringify(msgs));
            input.value = '';
            render();
        }
        render();
    </script>
</body>
</html>
